name = "blurkit-payment-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true

[vars]
NEXT_PUBLIC_SITE_URL = "https://blurkit.app"

[[routes]]
pattern = "api.blurkit.app/*"
zone_name = "blurkit.app"

# Secrets must be set via: wrangler secret put
# Run these commands:
# wrangler secret put DODO_SECRET_KEY
# wrangler secret put DODO_WEBHOOK_SECRET
# wrangler secret put RESEND_API_KEY
# wrangler secret put DATABASE_URL
