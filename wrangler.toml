name = "blurkit-website"
compatibility_date = "2024-01-01"

# Build configuration for Cloudflare Pages
[build]
command = "npm install && npm run build"
cwd = "."

# Output directory - Cloudflare Pages will serve from here
pages_build_output_dir = ".next/standalone/.next/static"

[env.production]
vars = { NODE_ENV = "production" }

# Environment variables (set these in Cloudflare dashboard):
# - DATABASE_URL (Neon PostgreSQL connection string)
# - RESEND_API_KEY (for email delivery)
# - DODO_SECRET_KEY (for payment processing)
# - DODO_WEBHOOK_SECRET (for payment webhooks)
# - RESEND_FROM_EMAIL (sender email address)
# - NEXT_PUBLIC_APP_URL (your app URL)
# - NEXT_PUBLIC_SITE_URL (your site URL)
# - NEXT_PUBLIC_CHROME_STORE_URL (Chrome store link)
